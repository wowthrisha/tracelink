<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="api-base" content="" />
  <meta name="supabase-url" content="SECUREDOC_SUPABASE_URL" />
  <meta name="supabase-anon-key" content="SECUREDOC_SUPABASE_ANON_KEY" />
  <title>SecureDoc</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🔒</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
    integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
    integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
    crossorigin="anonymous"></script>
  <script src="/static/api.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body,
    #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: #080B0C;
      font-family: 'DM Sans', sans-serif;
      color: #F0F2F1;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(90, 200, 208, 0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(90, 200, 208, 0.35);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(12px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .35;
      }
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes toastOut {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      to {
        opacity: 0;
        transform: translateY(8px) scale(.97);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .fade-up {
      animation: fadeUp .22s cubic-bezier(.22, 1, .36, 1) both;
    }

    .fade-in {
      animation: fadeIn .18s ease both;
    }

    .slide-in {
      animation: slideIn .2s cubic-bezier(.22, 1, .36, 1) both;
    }

    input,
    textarea,
    select {
      background: rgba(90, 200, 208, 0.04);
      border: 1px solid rgba(90, 200, 208, 0.15);
      border-radius: 7px;
      color: #F0F2F1;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color .15s, background .15s;
      width: 100%;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(90, 200, 208, 0.45);
      background: rgba(90, 200, 208, 0.07);
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(176, 196, 200, 0.45);
    }

    select option {
      background: #0E1416;
    }

    /* Focus ring for accessibility */
    button:focus-visible {
      outline: 2px solid rgba(90, 200, 208, 0.6);
      outline-offset: 2px;
    }

    /* Mobile: collapse sidebar and stack layout */
    @media (max-width: 640px) {
      /* Full-width sidebar becomes a top bar via JS class; handled in component */
      .sidebar-mobile-hidden {
        display: none !important;
      }
      /* Keep header buttons from overflowing; reduce padding */
      .header-root {
        padding: 0 10px !important;
      }
      .header-btn-label {
        display: none !important;
      }
      /* Toolbar: hide text labels, compress spacing */
      .toolbar-btn-label {
        display: none !important;
      }
      /* Viewer canvas: full-width padding on mobile */
      .viewer-page {
        border-radius: 0 !important;
      }
    }

    /* Smooth page transitions */
    .screen-enter {
      animation: fadeIn .18s ease both;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script src="/static/dist/app.bundle.js"></script>
</body>

</html>
