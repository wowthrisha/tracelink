name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install lint deps
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend/app backend/tests

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: securedoc
          POSTGRES_PASSWORD: password
          POSTGRES_DB: securedoc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://securedoc:password@localhost:5432/securedoc_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: development
          USE_DEMO_STORAGE: "1"
        run: pytest tests/ -x -q --tb=short

  backend-migrations:
    name: Migrations smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: securedoc
          POSTGRES_PASSWORD: password
          POSTGRES_DB: securedoc_migrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://securedoc:password@localhost:5432/securedoc_migrate
          MIGRATION_DATABASE_URL: postgresql+psycopg2://securedoc:password@localhost:5432/securedoc_migrate
        run: alembic upgrade head
      - name: Verify migration head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://securedoc:password@localhost:5432/securedoc_migrate
          MIGRATION_DATABASE_URL: postgresql+psycopg2://securedoc:password@localhost:5432/securedoc_migrate
        run: alembic current

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle
          path: frontend/dist/
          retention-days: 7

  # ── Security ─────────────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Backend audit
        working-directory: backend
        run: pip-audit -r requirements.txt --skip-editable || true
      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

  security-scan:
    name: Security scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run bandit
        working-directory: backend
        run: bandit -r app/ -ll -x app/tests || true

  # ── Docker ───────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: securedoc-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
