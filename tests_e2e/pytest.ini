[pytest]
asyncio_mode = auto
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    api: API contract tests (no browser)
    service: service unit tests (no HTTP)
    ui: Playwright browser UI tests
    e2e: full end-to-end scenario tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
