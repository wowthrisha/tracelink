# SecureDoc — full-stack Docker Compose
#
# One-command local deployment:
#   docker compose up --build
#   or: ./start.sh all
#
# Prerequisites:
#   cp backend/.env.example backend/.env   # then fill in your values
#
# Services:
#   db      — PostgreSQL 16 (local only; in production use a managed DB via DATABASE_URL)
#   redis   — Redis 7       (local only; in production use a managed Redis via REDIS_URL)
#   migrate — One-shot migration runner; api + worker wait for it to complete
#   api     — FastAPI backend + static frontend served at http://localhost:8000
#   worker  — Celery PDF-processing worker
#
# Migration safety
# ----------------
# The `migrate` service runs `alembic upgrade head` exactly once via migrate.py
# (which holds a PostgreSQL advisory lock).  api and worker depend on
# `migrate: service_completed_successfully` so they never start before the
# schema is ready.  Their own entrypoint.sh also calls migrate.py, but by then
# migrations are already at head — the advisory lock serialises the no-op call
# safely.  This belt-and-suspenders design also protects Railway deployments
# where no dedicated migrate service exists and both api + worker start
# simultaneously.

services:

  # ── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securedoc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: securedoc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securedoc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Migration runner (one-shot) ────────────────────────────────────────────
  # Runs alembic upgrade head under a PostgreSQL advisory lock, then exits.
  # api and worker will not start until this service exits with code 0.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Override the Dockerfile ENTRYPOINT so we bypass the entrypoint.sh wrapper
    # and run migrate.py directly (avoids the entrypoint calling migrate.py
    # which would call alembic inside a shell that itself calls alembic).
    entrypoint: ["python", "migrate.py"]
    command: []
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://securedoc:password@db:5432/securedoc
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── API (FastAPI + StaticFiles frontend) ───────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    # env_file supplies Supabase, storage, JWT, and app config.
    # The environment block below overrides DB/Redis with Docker-internal hostnames.
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://securedoc:password@db:5432/securedoc
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  # ── Celery worker ──────────────────────────────────────────────────────────
  # Concurrency and memory settings are driven by environment variables so they
  # can be tuned per deployment without rebuilding the image.
  #
  # Sizing guide (set in backend/.env or Railway dashboard):
  #   Development / 1 uploader:  WORKER_CONCURRENCY=2
  #   Production  / 10 uploaders: WORKER_CONCURRENCY=4  (requires 4GB+ RAM container)
  #
  # WORKER_MAX_TASKS_PER_CHILD=50 is recommended for production to recycle worker
  # processes and guard against memory accumulation in PDF processing libraries.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - "sh"
      - "-c"
      - >
        celery -A app.workers.celery_app worker
        --loglevel=${WORKER_LOG_LEVEL:-info}
        --concurrency=${WORKER_CONCURRENCY:-2}
        ${WORKER_MAX_TASKS_PER_CHILD:+--max-tasks-per-child=$WORKER_MAX_TASKS_PER_CHILD}
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://securedoc:password@db:5432/securedoc
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Celery Beat (periodic task scheduler) ──────────────────────────────────
  # Runs purge_stale_sessions every 30 min and requeue_orphaned_uploads every 5 min.
  # Must be a single instance — running multiple Beat workers causes duplicate task
  # submissions.  If Beat crashes, Docker restarts it; the next scheduled slot fires
  # on the next interval so no tasks are permanently skipped.
  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://securedoc:password@db:5432/securedoc
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
